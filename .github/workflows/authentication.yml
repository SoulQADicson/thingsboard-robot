name: Authentication UI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authentication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: infrastructure/compose.yaml
      COMPOSE_PROJECT_NAME: thingsboard-ci-${{ github.run_id }}-${{ github.run_attempt }}
      TB_BASE_URL: http://127.0.0.1:8080
      TB_HTTP_PORT: '8080'
      TB_USERNAME: tenant@thingsboard.org
      TB_BROWSER: chromium
      TB_HEADLESS: 'true'
      TB_UI_TIMEOUT: 30s
      TB_PASSWORD: ${{ secrets.TB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate credentials and generate database password
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          if not os.environ.get("TB_PASSWORD"):
              raise SystemExit("Configure o repository secret TB_PASSWORD para o tenant de demonstracao.")
          password = secrets.token_hex(32)
          print(f"::add-mask::{password}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"POSTGRES_PASSWORD={password}\n")
          PY

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          rfbrowser init --with-deps chromium
          python infrastructure/check_environment.py --browser

      - name: Initialize fresh ThingsBoard database
        run: |
          docker compose config --quiet
          docker compose pull
          docker compose run --rm -e INSTALL_TB=true -e LOAD_DEMO=true thingsboard-ce

      - name: Start ThingsBoard and wait for HTTP
        run: |
          docker compose up -d
          python infrastructure/wait_for_http.py --url "$TB_BASE_URL" --timeout 240

      - name: Run CT01 CT02 CT03
        run: python -m robot --include regression --outputdir results/authentication tests/ui/authentication.robot

      - name: Collect infrastructure diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p results/infrastructure
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            docker compose ps --all > results/infrastructure/containers.txt 2>&1
            docker compose logs --no-color --tail 200 > results/infrastructure/compose.log 2>&1
          else
            printf '%s\n' 'Infrastructure was not initialized.' > results/infrastructure/containers.txt
          fi

      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authentication-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop laboratory
        if: always()
        shell: bash
        run: |
          if [ -n "${POSTGRES_PASSWORD:-}" ]; then
            docker compose down --remove-orphans
          fi
